name: tests

on:
  push:
  pull_request:

jobs:
  pytest-in-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run pytest (api)
        run: |
          docker compose build api
          docker compose run --rm api pytest -q
